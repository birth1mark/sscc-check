openapi: 3.1.0
info:
  title: SSCC Pro Vision — Validation, EDI & GS1 Pallet Label API
  version: 5.9.0
  description: |
    Enterprise-grade Cloudflare Edge APIs for Serial Shipping Container Code (SSCC-18) validation,
    GS1 Modulo 10 check digit calculation, range expansion, UN/EDIFACT & SAP IDoc extraction,
    and Dual-Symbology GS1 Logistics Pallet Labels (1D GS1-128 + 2D QR Code GS1 Digital Link in
    native Zebra ZPL-II, Vector SVG, and Printable A5/4x6" HTML).
  contact:
    name: birth1mark
    url: https://pormenores.net/sscc/
  license:
    name: MIT
    url: https://github.com/birth1mark/sscc-check/blob/main/LICENSE
servers:
  - url: https://sscc.birth1mark.workers.dev
    description: Server 1 — Free Validation & EDI Extraction API
  - url: https://sscc-labels.birth1mark.workers.dev
    description: Server 2 — Commercial GS1 Pallet Labels, ZPL & 2D QR Digital Link API (25 Free / Pro X-API-Key)

paths:
  /validate:
    get:
      summary: Validate SSCC-18 Code
      description: |
        Validates an 18-digit SSCC or 20-digit code with Application Identifier (00).
        Calculates the GS1 Modulo 10 check digit and returns prefix country metadata.
      parameters:
        - name: sscc
          in: query
          required: true
          description: 18-digit SSCC or 20-digit SSCC with leading 00
          schema:
            type: string
            example: "356012345600000016"
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '400':
          description: Invalid input length or format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /generate:
    get:
      summary: Generate Check Digit for 17-digit Body
      description: Computes the GS1 Modulo 10 check digit for a 17-digit SSCC payload and returns the full 18-digit SSCC.
      parameters:
        - name: body
          in: query
          required: true
          description: 17-digit SSCC payload without check digit
          schema:
            type: string
            example: "35601234560000001"
      responses:
        '200':
          description: Generation result with full SSCC
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
        '400':
          description: Invalid body length
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /range:
    get:
      summary: Generate Sequential Range of SSCCs
      description: Expands a consecutive range of SSCC numbers (up to 500 codes per request) with calculated check digits.
      parameters:
        - name: from
          in: query
          required: true
          description: Starting 17-digit payload or 18-digit SSCC
          schema:
            type: string
            example: "35601234560000001"
        - name: to
          in: query
          required: true
          description: Ending 17-digit payload or 18-digit SSCC
          schema:
            type: string
            example: "35601234560000020"
      responses:
        '200':
          description: List of sequential SSCCs with check digits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RangeResponse'
        '400':
          description: Invalid range or count exceeds 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /prefix:
    get:
      summary: Lookup GS1 Prefix & Country
      description: Returns the GS1 member organization / country corresponding to the SSCC prefix.
      parameters:
        - name: sscc
          in: query
          required: true
          description: 18-digit SSCC
          schema:
            type: string
            example: "356012345600000016"
      responses:
        '200':
          description: Prefix metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrefixResponse'
        '400':
          description: Invalid SSCC
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /extract:
    post:
      summary: Extract SSCCs from Raw Text / File
      description: |
        Parses UN/EDIFACT (DESADV, ORDERS), SAP IDoc (DELVRY, INVOIC), XML, CSV, or plain text
        payloads (up to 1 MB) and extracts all detected SSCC codes with validation status.
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              example: "UNA:+.? 'UNB+UNOC:3...GIN+BJ+356012345600000016'..."
      responses:
        '200':
          description: Extraction summary with all found SSCCs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractResponse'
        '400':
          description: Empty request body or payload exceeds limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      summary: Service Health Check
      description: Returns API status, version, and available endpoints.
      responses:
        '200':
          description: Service status

  /v1/labels:
    post:
      summary: Generate Batch GS1 Pallet Labels (1D GS1-128 + 2D QR Digital Link / ZPL / HTML / SVG)
      description: |
        Generates 1 to 500 GS1 Logistics Pallet Labels with Dual Symbology (1D GS1-128 + 2D QR Digital Link),
        1D Only, or 2D QR Only. Supports Zebra ZPL-II, Printable HTML (A5/A6/4x6"), Vector SVG, and JSON.
        Includes 25 free labels per GS1 Company Prefix (GCP); pass X-API-Key for Pro credits.
      parameters:
        - name: X-API-Key
          in: header
          required: false
          description: Optional Pro API Key (sscc_pro_...) to bypass the 25 free label limit
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ssccs:
                  type: array
                  items:
                    type: string
                  description: Optional explicit list of 17/18/20-digit SSCCs
                gcp:
                  type: string
                  example: "5601234"
                extension:
                  type: string
                  example: "0"
                startSerial:
                  type: integer
                  example: 1001
                quantity:
                  type: integer
                  example: 5
                layout:
                  type: string
                  enum: [full, barcode-only]
                  default: full
                  description: Choose complete GS1 logistics pallet label ('full') or standalone SSCC barcode strip ('barcode-only')
                symbology:
                  type: string
                  enum: [dual, both, gs1-128, qr]
                  default: dual
                  description: Choose 'gs1-128' (1D only), 'qr' (2D QR Digital Link only), or 'dual'/'both' (1D + 2D QR)
                format:
                  type: string
                  enum: [json, zpl, html, svg]
                  default: json
                paperSize:
                  type: string
                  enum: [a5, a6, thermal]
                  default: a5
                sender:
                  type: string
                  example: "ACME LOGISTICS PORTUGAL LDA"
                recipient:
                  type: string
                  example: "CENTRAL DISTRIBUTION HUB"
                contents:
                  type: string
                  example: "EURO PALLET (MIXED CARGO)"
                weight:
                  type: string
                  example: "450 KG"
                orderNo:
                  type: string
                  example: "PO-2026-994"
                gtin:
                  type: string
                  example: "05601234567892"
                unitCount:
                  type: string
                  example: "48"
                batchNo:
                  type: string
                  example: "LOT-26A"
                expiryDate:
                  type: string
                  example: "2026-12-31"
      responses:
        '200':
          description: Generated GS1 labels or barcodes (JSON, ZPL-II, HTML, or SVG)
        '402':
          description: Free quota (25 labels) exceeded or Pro credits exhausted

  /v1/barcode:
    get:
      summary: Generate Standalone SSCC Barcode (1D GS1-128, 2D QR Digital Link, or Both)
      description: |
        Dedicated endpoint for users who compose their own label layouts and only need the SSCC barcode(s).
        Use 'type' (or 'symbology') to request 'gs1-128' (1D linear barcode), 'qr' (2D QR Code), or 'both' (1D + 2D QR).
        Use 'format=json' with 'type=both' to receive 'svg1d', 'svgQr', 'zpl1d', and 'zplQr' as separate fields.
      parameters:
        - name: sscc
          in: query
          required: true
          schema:
            type: string
            example: "356012345600000016"
        - name: type
          in: query
          required: false
          description: "Barcode symbology to generate: 'gs1-128' (1D only), 'qr' (2D QR only), or 'both'/'dual' (both 1D and 2D QR)"
          schema:
            type: string
            enum: [both, dual, gs1-128, qr]
            default: both
        - name: format
          in: query
          required: false
          description: "Output format: 'svg' (image/svg+xml), 'json' (separated svg1d & svgQr + zpl), or 'zpl' (Zebra ZPL-II)"
          schema:
            type: string
            enum: [svg, json, zpl]
            default: svg
        - name: batch
          in: query
          required: false
          schema:
            type: string
            example: "LOT-99A"
      responses:
        '200':
          description: Standalone barcode in Vector SVG (image/svg+xml), JSON, or Zebra ZPL-II

  /v1/qr:
    get:
      summary: Generate Standalone 2D GS1 Digital Link QR Code (SVG)
      description: Alias for /v1/barcode?type=qr. Returns an ISO/IEC 18004 vector SVG QR Code encoding the GS1 Digital Link URI for an SSCC.
      parameters:
        - name: sscc
          in: query
          required: true
          schema:
            type: string
            example: "356012345600000016"
        - name: batch
          in: query
          required: false
          schema:
            type: string
            example: "LOT-99A"
      responses:
        '200':
          description: Vector SVG QR Code (image/svg+xml)

  /v1/quota:
    get:
      summary: Check Remaining Free or Pro Label Credits
      parameters:
        - name: gcp
          in: query
          required: false
          schema:
            type: string
            example: "5601234"
        - name: X-API-Key
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Current quota balance and available credit plans

components:
  schemas:
    ValidationResponse:
      type: object
      properties:
        input:
          type: string
          example: "356012345600000016"
        sscc:
          type: string
          example: "356012345600000016"
        formatted:
          type: string
          example: "(00)356012345600000016"
        valid:
          type: boolean
          example: true
        checkDigit:
          type: object
          properties:
            provided:
              type: integer
              example: 6
            expected:
              type: integer
              example: 6
        gs1:
          $ref: '#/components/schemas/GS1Metadata'

    GenerationResponse:
      type: object
      properties:
        input:
          type: string
          example: "35601234560000001"
        body:
          type: string
          example: "35601234560000001"
        checkDigit:
          type: integer
          example: 6
        sscc:
          type: string
          example: "356012345600000016"
        formatted:
          type: string
          example: "(00)356012345600000016"
        gs1:
          $ref: '#/components/schemas/GS1Metadata'

    RangeResponse:
      type: object
      properties:
        from:
          type: string
          example: "35601234560000001"
        to:
          type: string
          example: "35601234560000020"
        count:
          type: integer
          example: 20
        items:
          type: array
          items:
            type: object
            properties:
              sscc:
                type: string
                example: "356012345600000016"
              formatted:
                type: string
                example: "(00)356012345600000016"
              checkDigit:
                type: integer
                example: 6

    PrefixResponse:
      type: object
      properties:
        sscc:
          type: string
          example: "356012345600000016"
        prefix:
          type: string
          example: "560"
        country:
          type: string
          example: "Portugal"
        countryCode:
          type: string
          example: "PT"
        flag:
          type: string
          example: "🇵🇹"

    ExtractResponse:
      type: object
      properties:
        format:
          type: string
          example: "edifact"
        found:
          type: integer
          example: 1
        valid:
          type: integer
          example: 1
        invalid:
          type: integer
          example: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/ValidationResponse'

    GS1Metadata:
      type: object
      properties:
        extensionDigit:
          type: integer
          example: 3
        prefix:
          type: string
          example: "560"
        country:
          type: string
          example: "Portugal"
        countryCode:
          type: string
          example: "PT"
        flag:
          type: string
          example: "🇵🇹"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Invalid length: expected 18 digits (or 20 with AI prefix), got 15"
